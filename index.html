<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Live Map Tracker</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap" rel="stylesheet">

  <!-- Custom Styles -->
  <link rel="stylesheet" href="style.css">

  <!-- Leaflet JS & MQTT.js via CDN -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
</head>

<body>
  <!-- Fullscreen Map Container -->
  <div id="map"></div>

  <!-- Top Bar: Room Info & Online Participants -->
  <div class="top-bar-container">
    <div class="room-badge" id="room-badge" title="Clicca per copiare il link della stanza">
      <span class="online-indicator"></span>
      <div class="badge-content">
        <span class="room-name" id="room-name-display">Stanza</span>
        <span class="badge-separator">•</span>
        <span class="user-count-wrapper">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor" class="users-icon">
            <path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/>
          </svg>
          <span id="user-count-text">1 online</span>
        </span>
      </div>
    </div>
    <div id="toast" class="toast">Link stanza copiato!</div>
  </div>

  <!-- Bottom Center Control Bar -->
  <div class="control-container">
    <button id="toggle-tracking-btn" class="tracking-btn tracking-active"
      aria-label="Ferma o riprendi il tracciamento della posizione">
      <span class="btn-indicator"></span>
      <span class="btn-icon" id="btn-icon">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
          <rect x="5" y="5" width="14" height="14" rx="2.5" />
        </svg>
      </span>
      <span class="btn-text" id="btn-text">STOP Tracking</span>
    </button>
  </div>

  <!-- Recenter Button (Google Maps Style) -->
  <button id="recenter-btn" class="recenter-btn" title="La tua posizione" aria-label="Centra mappa sulla tua posizione">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
      <path d="M12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm8.94 3A8.994 8.994 0 0 0 13 3.06V1h-2v2.06A8.994 8.994 0 0 0 3.06 11H1v2h2.06A8.994 8.994 0 0 0 11 20.94V23h2v-2.06A8.994 8.994 0 0 0 20.94 13H23v-2h-2.06zM12 19c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z"/>
    </svg>
  </button>

  <!-- Application Logic -->
  <script src="app.js"></script>
</body>

</html>
