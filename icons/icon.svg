<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Radar Pulse Wave Gradients -->
    <radialGradient id="pulseGrad1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="pulseGrad2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0" />
      <stop offset="80%" stop-color="#6366f1" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <!-- Center Pin Glow -->
    <radialGradient id="pinGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </radialGradient>

    <!-- Lock / E2EE Accent Gradient -->
    <linearGradient id="lockGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6" />
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer Ring Grid / Radar Rings -->
  <circle cx="256" cy="240" r="180" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="8 8" opacity="0.6" />
  <circle cx="256" cy="240" r="130" fill="url(#pulseGrad2)" stroke="#38bdf8" stroke-width="3" opacity="0.5" />
  <circle cx="256" cy="240" r="85" fill="url(#pulseGrad1)" stroke="#38bdf8" stroke-width="4" opacity="0.8" />

  <!-- Compass Crosshairs -->
  <line x1="256" y1="50" x2="256" y2="80" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" opacity="0.8" />
  <line x1="256" y1="400" x2="256" y2="430" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" opacity="0.4" />
  <line x1="66" y1="240" x2="96" y2="240" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" opacity="0.4" />
  <line x1="416" y1="240" x2="446" y2="240" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" opacity="0.4" />

  <!-- Main Location Marker Pin -->
  <g filter="url(#shadow)">
    <!-- Pin Body -->
    <path d="M256 120 C198.56 120 152 166.56 152 224 C152 292 236 376 256 394 C276 376 360 292 360 224 C360 166.56 313.44 120 256 120 Z" 
          fill="url(#pinGlow)" />
    
    <!-- Pin Core Circle (White) -->
    <circle cx="256" cy="220" r="48" fill="#ffffff" />
    
    <!-- Active Live Dot (Emerald / Cyan) -->
    <circle cx="256" cy="220" r="28" fill="#10b981" filter="url(#glow)" />
    <circle cx="256" cy="220" r="14" fill="#ecfdf5" />
  </g>

  <!-- Security Shield / E2EE Lock Badge at bottom right of pin -->
  <g transform="translate(310, 310)" filter="url(#shadow)">
    <circle cx="36" cy="36" r="36" fill="#0f172a" stroke="#10b981" stroke-width="4" />
    <!-- Shield / Lock icon -->
    <path d="M36 18 L22 24 V34 C22 43 28 51.4 36 54 C44 51.4 50 43 50 34 V24 L36 18 Z" fill="url(#lockGrad)" />
    <!-- Checkmark inside Shield -->
    <path d="M30 36 L34 40 L43 30" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
